services:
  training:
    build:
      context: .
      dockerfile: docker/Dockerfile.training
      args:
        TRAIN_BASE_IMAGE: ${TRAIN_BASE_IMAGE:-python:3.10-slim-bookworm}
    working_dir: /workspace
    volumes:
      - .:/workspace
    gpus: all
    stdin_open: true
    tty: true

  dxcompile:
    image: ${DX_COMPILE_IMAGE:-lwir-dxcompile:local}
    build:
      context: .
      dockerfile: docker/Dockerfile.dxcompile
      args:
        DX_COMPILER_BASE_IMAGE: ${DX_COMPILER_BASE_IMAGE:-dx-compiler:2.4.2-dxcom-2.4.1-ubuntu-22.04}
        EXPECTED_DX_COM_VERSION: "2.4.1"
    working_dir: /deepx/workspace
    environment:
      VIRTUAL_ENV: /venv-dxnn
      PATH: /venv-dxnn/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - .:/deepx/workspace
    stdin_open: true
    tty: true
